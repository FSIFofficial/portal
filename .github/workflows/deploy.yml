name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - id: pages
        uses: actions/configure-pages@v5
      # GAS_URL などが未設定のまま公開すると、本番サイトがデモモード（サンプルデータ）になってしまうので止める。
      # わざとデモとして公開したい場合だけ、Variables に ALLOW_DEMO=true を追加する。
      - name: Check required variables
        if: ${{ vars.ALLOW_DEMO != 'true' }}
        env:
          GAS_URL: ${{ vars.GAS_URL }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
        run: |
          missing=""
          [ -z "$GAS_URL" ] && missing="$missing GAS_URL"
          [ -z "$GOOGLE_CLIENT_ID" ] && missing="$missing GOOGLE_CLIENT_ID"
          if [ -n "$missing" ]; then
            echo "::error::リポジトリの Variables に$missing が設定されていません（Secrets ではなく Variables タブに登録してください）。デモとして公開する場合は Variables に ALLOW_DEMO=true を追加してください。"
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # Settings > Secrets and variables > Actions > Variables で設定（未設定ならデモモード）
          NEXT_PUBLIC_GAS_URL: ${{ vars.GAS_URL }}
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          # アクセス権限管理（/access/）の GAS の URL。未設定なら /access/ は「未設定」の案内を出す
          NEXT_PUBLIC_ACCESS_GAS_URL: ${{ vars.ACCESS_GAS_URL }}
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
